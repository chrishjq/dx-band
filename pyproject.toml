[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dx-band"
version = "2026.11.10.1"
description = "DX Band local dual-screen lyrics and six-stem playback workstation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PySide6>=6.8,<7",
  "numpy>=2.2.6,<3",
  "pydantic>=2,<3",
  "av>=12",
  "sounddevice>=0.5,<1",
  "opencc>=1.4,<2",
  "qrcode>=8,<9",
]

[project.optional-dependencies]
ai = [
  "beat-this==1.1.0",
  "funasr>=1.4.26,<2",
  "demucs>=4.1,<5",
  "librosa>=0.11,<2",
  "mir-eval>=0.8,<1",
  "pretty-midi>=0.2,<1",
  "mido>=1.3,<2",
  "torchaudio>=2,<3",
  "onnxruntime>=1.23,<2",
  "ctc-segmentation>=1.7.5,<2",
  "transformers>=4.45,<5",
]
dev = [
  "mypy>=1.13",
  "pillow>=11,<13",
  "pytest>=8",
  "pytest-qt>=4",
  "ruff>=0.8",
]
packaging = [
  "pyinstaller>=6.11,<7",
]

[project.scripts]
dx-band = "dxband.__main__:main"
dx-band-worker = "dxband.workers.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dxband"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["PySide6.*", "beat_this.*", "mir_eval", "torchaudio", "librosa", "librosa.*", "sounddevice", "soundfile", "funasr", "onnxruntime", "ctc_segmentation", "qrcode", "scipy.*", "transformers", "transformers.*"]
ignore_missing_imports = true
