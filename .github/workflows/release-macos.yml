name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build macOS release
        run: |
          chmod +x scripts/build_macos_release.sh
          ./scripts/build_macos_release.sh

      - name: Resolve artifact names
        id: artifacts
        run: |
          VERSION="$(uv run --no-sync python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          PY
          )"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dmg=DX-Band-${VERSION}-macos-arm64.dmg" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dx-band-macos-arm64
          path: dist/${{ steps.artifacts.outputs.dmg }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          DMG="dist/${{ steps.artifacts.outputs.dmg }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" \
              --title "DX Band ${{ steps.artifacts.outputs.version }}" \
              --notes "$(cat <<EOF
          ## macOS (Apple Silicon)

          Download \`${{ steps.artifacts.outputs.dmg }}\`, open it, and drag **DX Band** into Applications.

          Model weights are **not** included. After installing, open **Settings** and download models by role. If FFmpeg is missing, download it under **Settings → Runtime Tools**.

          Unsigned builds may need System Settings → Privacy & Security → Open Anyway on first launch.
          EOF
          )"
          fi
