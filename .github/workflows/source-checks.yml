name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install source dependencies
        run: uv sync --locked --extra ai --extra dev
      - name: Check source resources
        run: uv run --no-sync python scripts/check_open_source_resources.py
      - name: Lint source
        run: uv run --no-sync ruff check src scripts/check_open_source_resources.py scripts/beat_benchmark.py scripts/run_beat_this.py
      - name: Type-check source
        run: uv run --no-sync mypy src
      - name: Test non-GUI modules
        run: uv run --no-sync pytest -q tests/analysis tests/creation tests/integration tests/services tests/unit
      - name: Test desktop and browser UI
        run: uv run --no-sync pytest -q tests/ui
