<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>DX Band 乐手屏</title>
  <style>
    :root {
      color-scheme: dark;
      --accent: #ffd166;
      --accent-soft: rgba(255, 209, 102, .12);
      --ink: #f4f7fb;
      --muted: #8791a3;
      --panel: rgba(18, 24, 34, .86);
      --line: rgba(255, 255, 255, .09);
      --font-scale: 1;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC",
        "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #070a0f; }
    body {
      color: var(--ink);
      background:
        radial-gradient(circle at 82% -10%, rgba(255, 209, 102, .12), transparent 36%),
        radial-gradient(circle at 0% 80%, rgba(57, 134, 255, .08), transparent 42%),
        #070a0f;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    button { font: inherit; color: inherit; }
    .shell { height: 100%; display: grid; grid-template-rows: auto 1fr; }
    header {
      display: flex; align-items: center; gap: 18px; min-height: 78px;
      padding: calc(12px + env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 12px
        max(20px, env(safe-area-inset-left));
      border-bottom: 1px solid var(--line); background: rgba(7, 10, 15, .78);
      backdrop-filter: blur(18px); z-index: 4;
    }
    .brand { display: flex; align-items: center; flex: 0 0 auto; }
    .mark {
      width: 48px; height: 40px; overflow: hidden; flex: 0 0 auto;
      box-shadow: 0 0 24px rgba(73, 93, 255, .2);
    }
    .mark img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .song-meta { min-width: 0; flex: 1; }
    .song-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 20px; font-weight: 730; }
    .song-subtitle { margin-top: 5px; color: var(--muted); font-size: 12px; letter-spacing: .03em; }
    .status { display: flex; align-items: center; gap: 8px; color: #8fd9b6; font-size: 12px; }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 12px currentColor; }
    .status.offline { color: #ff7a88; }
    .header-controls { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
    .transport { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; min-width: 84px; }
    .tool {
      height: 34px; min-width: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px;
      background: rgba(255, 255, 255, .04); cursor: pointer; touch-action: manipulation; white-space: nowrap;
    }
    .tool:active { background: var(--accent-soft); border-color: rgba(255, 209, 102, .35); }
    .chord-modes {
      display: inline-flex; height: 34px; border: 1px solid var(--line);
      border-radius: 9px; background: rgba(255, 255, 255, .025); flex: 0 0 auto;
    }
    .chord-mode-option {
      min-width: 54px; padding: 0 12px; border: 0; border-right: 1px solid var(--line);
      background: transparent; color: var(--muted); cursor: pointer; touch-action: manipulation;
      font-size: 13px; font-weight: 650;
    }
    .chord-mode-option[aria-pressed="true"] { background: var(--accent); color: #17130a; }
    .chord-mode-option:focus-visible { outline: 2px solid #fff; outline-offset: -3px; }
    .chord-key-select {
      min-width: 86px; padding: 0 24px 0 10px; border: 0; border-left: 1px solid var(--line);
      border-radius: 0 8px 8px 0; background: transparent; color: var(--muted);
      cursor: pointer; font-size: 13px; font-weight: 650; font-family: inherit; color-scheme: dark;
    }
    .chord-key-select.active { background: var(--accent); color: #17130a; color-scheme: light; }
    .chord-key-select:focus-visible { outline: 2px solid #fff; outline-offset: -3px; }
    .stage {
      position: relative; min-height: 0; overflow-x: hidden; overflow-y: scroll;
      overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .stage::-webkit-scrollbar { display: none; }
    .scroll-rail {
      position: fixed; right: 0; z-index: 5; width: 24px; padding: 0 8px;
      border-radius: 8px;
      background: linear-gradient(90deg, transparent 0 8px, rgba(255, 255, 255, .08) 8px 16px, transparent 16px);
      touch-action: none; cursor: pointer;
    }
    .scroll-rail[hidden] { display: none; }
    .scroll-thumb {
      width: 8px; border-radius: 8px; background: rgba(143, 225, 200, .75);
      box-shadow: 0 0 6px rgba(143, 225, 200, .2);
    }
    .score { position: relative; width: 100%; min-width: 0; padding: var(--score-lead, 34vh) 5vw 48vh; }
    .follow-button {
      position: fixed; right: calc(20px + env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom));
      z-index: 5; padding: 10px 14px; border: 1px solid rgba(143, 225, 200, .6);
      border-radius: 9px; background: #172c30; color: #b9f6e0; cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .35);
    }
    .follow-button[hidden] { display: none; }
    .score-row {
      position: relative; min-height: calc(104px * var(--font-scale)); padding: 10px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, .055);
      transition: background .18s ease, border-color .18s ease;
    }
    .score-row.has-melody { padding-top: 22px; }
    .score-row.has-meter { padding-top: 47px; }
    .has-melody .beat-cell { grid-template-rows: minmax(calc(38px * var(--font-scale)), auto) calc(82px * var(--font-scale)) minmax(30px, auto); }
    .melody-cell {
      min-width: 0; width: 100%; height: calc(76px * var(--font-scale)); display: flex; align-items: flex-start;
      justify-content: center; gap: 2px; padding-top: calc(16px * var(--font-scale)); align-self: end; overflow: visible;
      color: #aeb5c0; font-size: calc(clamp(17px, 1.8vw, 27px) * var(--font-scale));
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    }
    .melody-group {
      position: relative; display: inline-flex; align-items: flex-start; gap: clamp(1px, .3vw, 5px);
      width: max-content; max-width: none; flex-shrink: 0; white-space: nowrap;
    }
    .melody-beam-line { position: absolute; height: 0; border-bottom: 1px solid #aeb5c0; pointer-events: none; }
    .melody-triplet::before {
      content: '3'; position: absolute; bottom: calc(100% + .4em); left: 50%;
      transform: translateX(-50%); font-size: .54em; line-height: 1;
    }
    .melody-tie-layer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .melody-note { position: relative; display: inline-flex; align-items: baseline; line-height: 1; padding: 2px 1px 0; }
    .melody-pitch { position: relative; display: inline-flex; align-items: baseline; }
    .melody-pitch.has-accidental { padding-left: .48em; }
    .melody-number { display: inline-block; }
    .melody-augmentation { font-size: .42em; align-self: flex-end; margin-left: 1px; }
    .melody-accidental { position: absolute; left: 0; top: -.38em; font-size: .65em; line-height: 1; }
    .melody-octave { position: absolute; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; font-size: .48em; }
    .melody-octave > i { font-style: normal; line-height: .58; }
    .melody-octave.up { bottom: 100%; }
    .melody-octave.down { top: 100%; }
    .melody-pitch.has-accidental .melody-octave { left: calc(50% + .24em); }
    .melody-rest { font-family: Arial, sans-serif; }
    .melody-gap { color: #9daaba; font-size: 11px; white-space: nowrap; }
    .bar-grid { position: relative; display: grid; grid-template-columns: repeat(var(--bar-columns), minmax(0, 1fr)); height: 100%; }
    .bar-measure {
      min-width: 0; position: relative; display: grid; grid-template-columns: repeat(var(--bar-beats), minmax(0, 1fr));
      border-left: 1px solid rgba(255, 255, 255, .16); padding: 0 4px;
      transition: background .18s ease, box-shadow .18s ease;
    }
    .score-row.has-melody .bar-measure { border-left: 0; }
    .score-row.has-melody .bar-measure::after {
      content: ''; position: absolute; top: var(--measure-line-top, 0px); left: 0;
      height: var(--measure-line-height, 0px); border-left: 1px solid rgba(255, 255, 255, .16);
      pointer-events: none;
    }
    .bar-measure.active {
      background: linear-gradient(180deg, rgba(255, 209, 102, .24), rgba(255, 209, 102, .13));
      box-shadow: inset 0 -3px 0 rgba(255, 209, 102, .92);
    }
    .bar-measure.active .melody-cell { color: #f0f4fa; }
    .bar-measure.active .melody-beam-line { border-bottom-color: #f0f4fa; }
    .bar-measure.active .chord-token { background: rgba(255, 209, 102, .2); }
    .meter-label {
      position: absolute; top: -22px; left: 0; z-index: 2; transform: translateX(-50%);
      padding: 2px 5px; border: 1px solid rgba(174, 181, 192, .55); border-radius: 4px;
      color: #aeb5c0; background: rgba(174, 181, 192, .08);
      font: 700 calc(11px * var(--font-scale)) ui-monospace, Menlo, monospace;
      line-height: 1; white-space: nowrap; pointer-events: none;
    }
    .bar-measure .beat-cell.bar-start { border-left-color: transparent; }
    .beat-cell {
      min-width: 0; padding: 4px 8px; border-left: 1px solid transparent;
      display: grid; grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(28px, auto) minmax(30px, auto);
      align-items: end;
    }
    .beat-cell.bar-start { border-left-color: rgba(255, 255, 255, .16); }
    .chords {
      min-height: calc(36px * var(--font-scale)); display: flex; align-items: center; justify-content: center; gap: 2px;
      color: var(--accent); font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: calc(clamp(14px, 1.9vw, 25px) * var(--font-scale)); font-weight: 750;
      justify-self: center; width: max-content; text-align: center; white-space: nowrap; letter-spacing: -.025em;
    }
    .chords.positioned-chords { position: relative; justify-self: stretch; width: 100%; }
    .chord-unit { position: absolute; top: 50%; transform: translate(-50%, -50%); white-space: nowrap; }
    .chord-token {
      display: inline-block; white-space: nowrap; padding: 2px clamp(2px, .35vw, 6px) 3px;
      border: 1px solid rgba(255, 209, 102, .5); border-radius: 8px;
      background: rgba(255, 209, 102, .07); line-height: 1.1;
    }
    .melody-key-change { color: #c2c8d0; font-size: .6em; white-space: nowrap; }
    .chord-sup {
      display: inline-block; position: relative; top: -.35em;
      font-size: .67em; line-height: 1;
    }
    .lyrics {
      position: relative; height: 1.25em; min-height: 1.25em; color: #fff;
      font-size: var(--fitted-lyric-size, var(--live-lyric-size, calc(clamp(17px, calc(2vw + 2px), 29px) * var(--font-scale))));
      line-height: 1.25;
      font-weight: 620; justify-self: center; width: max-content; text-align: center;
      white-space: nowrap;
    }
    .lyrics.positioned-lyrics { justify-self: stretch; width: 100%; }
    .lyric-unit { position: absolute; top: 0; line-height: inherit; transform: translateX(-50%); }
    .line-chords { color: var(--accent); font: 750 calc(20px * var(--font-scale)) ui-monospace, Menlo, monospace; min-height: 26px; }
    .line-lyrics { margin-top: 7px; color: #fff; font-size: calc(clamp(24px, 3vw, 38px) * var(--font-scale)); font-weight: 650; }
    .guide {
      position: fixed; z-index: 2; top: calc(var(--stage-top, 78px) + clamp(24px, 10vh, 92px));
      left: 50%; width: min(420px, calc(100% - 32px));
      transform: translateX(-50%); padding: 13px 22px 15px; border: 1px solid #295b81; border-radius: 14px;
      background: #0b1a2b; color: #a6dcff;
    }
    .guide[hidden] { display: none; }
    .guide-copy { display: flex; justify-content: center; align-items: baseline; gap: 22px; }
    .guide-label { font-size: clamp(15px, 2.2vw, 19px); font-weight: 650; }
    .guide-number { color: #69c8ff; font-size: clamp(32px, 5vw, 44px); line-height: 1; font-variant-numeric: tabular-nums; }
    .guide-dots { display: flex; justify-content: center; align-items: center; gap: clamp(9px, 3vw, 22px); margin-top: 12px; }
    .guide-dot { width: 13px; height: 13px; border: 1px solid #5a98c4; border-radius: 50%; background: #376b94; }
    .guide-dot.elapsed { border-color: #366783; background: #0b1a2b; }
    .guide-dot.current { border-color: #bce8ff; background: #69c8ff; }
    .guide-dot.new-bar { margin-left: 12px; }
    .empty {
      position: absolute; inset: 0; display: grid; place-items: center; padding: 30px; text-align: center;
      color: var(--muted);
    }
    .empty[hidden] { display: none; }
    .empty strong { display: block; color: var(--ink); margin-bottom: 8px; font-size: 22px; }
    .toast {
      position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translate(-50%, 18px);
      padding: 9px 14px; border-radius: 10px; background: #252c38; opacity: 0; pointer-events: none;
      transition: .2s ease; z-index: 8; font-size: 13px;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

        display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
        grid-template-rows: auto auto; min-height: 98px; gap: 8px 12px;
        padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
      }
      .brand { grid-column: 1; grid-row: 1; }
      .song-meta { grid-column: 2; grid-row: 1; }

      .header-controls { grid-column: 1 / -1; grid-row: 2; width: 100%; }
      .header-controls .transport { margin-right: auto; white-space: nowrap; }
    }
    @media (max-width: 680px) {
      header {
        display: grid; grid-template-columns: auto minmax(0, 1fr) auto;

        padding: calc(7px + env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) 7px
          max(8px, env(safe-area-inset-left));
      }
      .brand { grid-column: 1; grid-row: 1; }

      .export-label { display: none; }

      .score { padding-left: 2vw; padding-right: 2vw; }

      }

      }

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const elements = { score: $('score'), empty: $('empty'), stage: $('stage'), scrollRail: $('scrollRail'), scrollThumb: $('scrollThumb'), followPlayback: $('followPlayback'), title: $('songTitle'), subtitle: $('songSubtitle'), pdfTitle: $('pdfSongTitle'), pdfArtist: $('pdfSongArtist'), pdfDetails: $('pdfSongDetails'), status: $('status'), transport: $('transport'), fullscreen: $('fullscreen'), exportPdf: $('exportPdf'), guide: $('guide'), guideRemaining: $('guideRemaining'), guideDots: $('guideDots'), toast: $('toast') };
      const pageParams = new URLSearchParams(location.search);
      const isLocalDisplay = pageParams.get('local') === '1';
      const isPdfPage = pageParams.get('pdf') === '1';
      const isOfflinePdfPage = isPdfPage && pageParams.get('offline') === '1';
      const state = { song: null, display: { chord_mode: 'degree', offset_ms: 0 }, guide: { remaining: 0, total: 0 }, transport: { state: 'empty', position_ms: 0 }, receivedAt: performance.now(), rows: [], measures: [], chordTargets: [], renderRows: [], rowTops: [], rowHeights: [], stageHeight: 0, barsPerRow: 2 };
      let fontScale = Number(localStorage.getItem('dx-band-font-scale') || 1);
      let chordMode = localStorage.getItem('dx-band-chord-mode') || '';
      let selectedKeyMode = '';
      let selectedKeySong = '';
      let activeMeasure = null;
      let autoFollow = true;
      let scrollDragOffset = null;
      let scrollDragMetrics = null;
      let scrollRailFrame = 0;
      let layoutFrame = 0;
      let visibleLayoutFrame = 0;
      let backgroundLayoutTimer = 0;
      const dirtyLayoutRows = new Set();
      let lastAnimationAt = 0;
      let lastTransportText = '';
      const scrollRailMetrics = { maxScroll: 0, travel: 0 };
      let pdfExporting = isPdfPage;
      if (isPdfPage) document.documentElement.classList.add('pdf-export');

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const formatTime = (ms) => {
        const seconds = Math.max(0, Math.floor(ms / 1000));
        return `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
      };
      const toast = (text) => {
        elements.toast.textContent = text; elements.toast.classList.add('show');
        clearTimeout(toast.timer); toast.timer = setTimeout(() => elements.toast.classList.remove('show'), 1800);
      };
      const updateFullscreenControl = () => {
        const active = Boolean(document.fullscreenElement);
        elements.fullscreen.textContent = active ? '退出' : '全屏';
        elements.fullscreen.setAttribute('aria-label', active ? '退出全屏' : '进入全屏');
        elements.fullscreen.setAttribute('aria-pressed', String(active));
      };

        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch (_error) {
          toast('当前浏览器不允许进入全屏');
        }
      };
      const position = () => {
        const base = Number(state.transport.position_ms || 0);
        return state.transport.state === 'playing' ? base + performance.now() - state.receivedAt : base;
      };
      const applyFontScale = () => {
        fontScale = clamp(fontScale, .56, 10);
        document.documentElement.style.setProperty('--font-scale', fontScale.toFixed(2));
        localStorage.setItem('dx-band-font-scale', String(fontScale));
        if (state.song && responsiveBarsPerRow() !== state.barsPerRow) {
          renderSong();
          return;
        }
        if (state.song) setLiveLyricSize(state.renderRows);
        if (pdfExporting) scheduleScoreLayout();
        else {
          state.rows.forEach((row) => dirtyLayoutRows.add(row));
          measureRows();
          scheduleVisibleScoreLayout();
        }
      };
      window.dxBandSetFontScale = (scale) => { fontScale = Number(scale) || 1; applyFontScale(); };
      const measureRows = () => {
        state.stageHeight = elements.stage.clientHeight;
        elements.score.style.setProperty('--score-lead', `${Math.round(state.stageHeight * .34)}px`);
        state.rows = Array.from(elements.score.querySelectorAll('.score-row'));
        state.rowTops = state.rows.map((row) => row.offsetTop);
        state.rowHeights = state.rows.map((row) => row.offsetHeight);
        updateScrollRail();
      };
      const updateScrollThumb = () => {
        const maxScroll = scrollRailMetrics.maxScroll;
        if (elements.scrollRail.hidden || maxScroll <= 0) return;
        const fraction = clamp(elements.stage.scrollTop / maxScroll, 0, 1);
        elements.scrollThumb.style.transform = `translate3d(0, ${scrollRailMetrics.travel * fraction}px, 0)`;
        const value = Math.round(100 * fraction);
        if (elements.scrollRail.getAttribute('aria-valuenow') !== String(value)) {
          elements.scrollRail.setAttribute('aria-valuenow', String(value));
        }
      };
      const scheduleScrollThumbUpdate = () => {
        if (scrollRailFrame) return;
        scrollRailFrame = requestAnimationFrame(() => {
          scrollRailFrame = 0;
          updateScrollThumb();
        });
      };
      const updateScrollRail = () => {
        const stage = elements.stage;
        const bounds = stage.getBoundingClientRect();
        document.documentElement.style.setProperty('--stage-top', `${bounds.top}px`);
        const maxScroll = stage.scrollHeight - stage.clientHeight;
        elements.scrollRail.hidden = isPdfPage || !state.song?.rows?.length || maxScroll <= 1;
        if (elements.scrollRail.hidden) return;
        elements.scrollRail.style.top = `${bounds.top + 8}px`;
        elements.scrollRail.style.height = `${Math.max(0, bounds.height - 16)}px`;
        const trackHeight = Math.max(0, bounds.height - 16);
        const thumbHeight = clamp(trackHeight * stage.clientHeight / stage.scrollHeight, 28, trackHeight);
        scrollRailMetrics.maxScroll = maxScroll;
        scrollRailMetrics.travel = Math.max(0, trackHeight - thumbHeight);
        elements.scrollThumb.style.height = `${thumbHeight}px`;
        updateScrollThumb();
      };
      const fitLyricFont = () => {
        if (!pdfExporting) return;
        elements.score.querySelectorAll('.bar-grid').forEach((grid) => {
          grid.style.removeProperty('--fitted-lyric-size');
          const labels = Array.from(grid.querySelectorAll('.lyrics')).filter((label) => label.textContent.trim());
          labels.forEach((label) => label.style.removeProperty('transform'));
          if (!labels.length) return;
          let size = parseFloat(getComputedStyle(labels[0]).fontSize);
          const crowded = () => {
            const bounds = grid.getBoundingClientRect();
            const rects = labels.flatMap((label) => label.classList.contains('positioned-lyrics')
              ? Array.from(label.querySelectorAll('.lyric-unit')).map((unit) => unit.getBoundingClientRect())
              : [label.getBoundingClientRect()]).sort((left, right) => left.left - right.left);
            if (rects.some((rect) => rect.left < bounds.left + 2 || rect.right > bounds.right - 2)) return true;
            return rects.some((rect, index) => index + 1 < rects.length && rect.right + 2 > rects[index + 1].left);
          };
          grid.style.setProperty('--fitted-lyric-size', `${size}px`);
          positionLyricUnits(false, grid);
          while (size > 13 && crowded()) {
            size -= 1;
            grid.style.setProperty('--fitted-lyric-size', `${size}px`);
            positionLyricUnits(false, grid);
          }
        });
      };
      const fitChordBadges = (scope = elements.score) => {
        scope.querySelectorAll('.chords').forEach((label) => label.style.removeProperty('transform'));
        scope.querySelectorAll('.chords .chord-token').forEach((badge) => badge.style.removeProperty('font-size'));
        scope.querySelectorAll('.bar-grid').forEach((grid) => {
          const tokens = Array.from(grid.querySelectorAll('.beat-cell .chords .chord-token'));
          const bounds = tokens.map((token) => token.getBoundingClientRect());
          const sizes = new Map();
          for (let index = 0; index + 1 < tokens.length; index += 1) {
            const firstBounds = bounds[index];
            const secondBounds = bounds[index + 1];
            const overlap = firstBounds.right + 2 - secondBounds.left;
            if (overlap <= 0) continue;
            const larger = firstBounds.width >= secondBounds.width ? tokens[index] : tokens[index + 1];
            const largerWidth = Math.max(1, larger === tokens[index] ? firstBounds.width : secondBounds.width);
            const size = parseFloat(getComputedStyle(larger).fontSize);
            const minimum = Math.max(11, parseFloat(getComputedStyle(larger.parentElement).fontSize) * .65);
            const reduced = size * Math.max(.1, (largerWidth - overlap) / largerWidth);
            sizes.set(larger, Math.min(sizes.get(larger) ?? size, Math.max(minimum, reduced)));
          }
          sizes.forEach((size, token) => { token.style.fontSize = `${size}px`; });
        });
      };
      const fitMelodyGroups = (scope = elements.score) => {
        scope.querySelectorAll('.beat-cell .melody-group').forEach((group) => {
          group.style.removeProperty('font-size');
          group.style.removeProperty('transform');
          const notes = Array.from(group.querySelectorAll('.melody-note'));
          if (!notes.length) return;
          const cellElement = group.closest('.beat-cell');
          const cell = cellElement.getBoundingClientRect();
          const cellStyle = getComputedStyle(cellElement);
          const left = cell.left + parseFloat(cellStyle.paddingLeft) + 2;
          const right = cell.right - parseFloat(cellStyle.paddingRight) - 2;
          let size = parseFloat(getComputedStyle(group).fontSize);
          const measuredWidth = () => {
            const first = notes[0].getBoundingClientRect();
            const last = notes[notes.length - 1].getBoundingClientRect();
            return Math.max(1, last.right - first.left);
          };
          const available = Math.max(1, right - left);
          const initialWidth = measuredWidth();
          if (initialWidth > available && size > 7) {
            size = Math.max(7, size * available / initialWidth);
            group.style.fontSize = `${size}px`;
          }
          const width = measuredWidth();
          if (width > available) {
            group.style.transform = `scaleX(${Math.min(1, available / width)})`;
          }
        });
      };
      const fitChordText = (scope = elements.score) => {
        if (pdfExporting) return;
        scope.querySelectorAll('.beat-cell').forEach((cell) => {
          const bounds = cell.getBoundingClientRect();
          const style = getComputedStyle(cell);
          const available = bounds.width - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight) - 4;
          cell.querySelectorAll('.chords:not(.positioned-chords)').forEach((label) => {
            label.style.removeProperty('transform');
            const width = label.scrollWidth;
            if (width > available) label.style.transform = `scaleX(${Math.max(0.1, available / width)})`;
          });
        });
      };
      const positionMeasureLines = (scope = elements.score) => {
        const positions = Array.from(scope.querySelectorAll('.score-row.has-melody .bar-measure'))
          .map((measure) => {
            const melody = measure.querySelector('.melody-cell');
            if (!melody) return null;
            const barBounds = measure.getBoundingClientRect();
            const melodyBounds = melody.getBoundingClientRect();
            return {measure, top: melodyBounds.top - barBounds.top, height: melodyBounds.height};
          }).filter(Boolean);
        positions.forEach(({measure, top, height}) => {
          measure.style.setProperty('--measure-line-top', `${top}px`);
          measure.style.setProperty('--measure-line-height', `${height}px`);
        });
      };
      const scoreUnitX = (cell, bounds, step) => {
        const note = Array.from(cell.querySelectorAll('.melody-note[data-start16th]'))
          .find((item) => Number(item.dataset.start16th) === step);
        if (note) {
          const rect = note.querySelector('.melody-number, .melody-pitch')?.getBoundingClientRect() || note.getBoundingClientRect();
          return (rect.left + rect.right) / 2 - bounds.left;
        }
        const beatStart = Number(cell.dataset.start16th);
        return Number.isFinite(beatStart)
          ? bounds.width * clamp((step - beatStart + .5) / 4, .05, .95)
          : bounds.width / 2;
      };
      const positionChordUnits = (scope = elements.score) => {
        scope.querySelectorAll('.chords.positioned-chords').forEach((label) => {
          const cell = label.closest('.beat-cell');
          const bounds = label.getBoundingClientRect();
          label.querySelectorAll('.chord-unit[data-start16th]').forEach((unit) => {
            unit.style.left = `${scoreUnitX(cell, bounds, Number(unit.dataset.start16th))}px`;
          });
        });
      };
      const positionLyricUnits = (fit = false, scope = elements.score) => {
        scope.querySelectorAll('.lyrics.positioned-lyrics').forEach((label) => {
          const cell = label.closest('.beat-cell');
          label.style.removeProperty('transform');
          label.style.removeProperty('left');
          if (!fit) label.style.removeProperty('font-size');
          const notes = new Map(Array.from(cell.querySelectorAll('.melody-note[data-start16th]'))
            .map((note) => [note.dataset.start16th, note]));
          const placeUnits = () => {
            const bounds = label.getBoundingClientRect();
            const positioned = Array.from(label.querySelectorAll('.lyric-unit[data-start16th]')).flatMap((unit) => {
              const note = notes.get(unit.dataset.start16th);
              const rect = note
                ? note.querySelector('.melody-number, .melody-pitch')?.getBoundingClientRect() || note.getBoundingClientRect()
                : null;
              const x = rect
                ? (rect.left + rect.right) / 2 - bounds.left
                : scoreUnitX(cell, bounds, Number(unit.dataset.start16th));
              return [{unit, x, width: unit.getBoundingClientRect().width}];
            }).sort((left, right) => left.x - right.x);
            if (!positioned.length) return;
            const originalMidpoint = (positioned[0].x + positioned[positioned.length - 1].x) / 2;
            for (let index = 1; index < positioned.length; index += 1) {
              const previous = positioned[index - 1];
              const current = positioned[index];
              current.x = Math.max(current.x, previous.x + (previous.width + current.width) / 2 + 1);
            }
            const first = positioned[0];
            const last = positioned[positioned.length - 1];
            const left = first.x - first.width / 2;
            const right = last.x + last.width / 2;
            const midpoint = (left + right) / 2;
            const shift = right - left <= bounds.width - 2
              ? clamp(originalMidpoint - midpoint, 1 - left, bounds.width - 1 - right)
              : bounds.width / 2 - midpoint;
            positioned.forEach(({unit, x}) => { unit.style.left = `${x + shift}px`; });
          };
          placeUnits();
        });
      };
      const spaceLiveLyrics = (scope = elements.score) => {
        scope.querySelectorAll('.bar-grid').forEach((grid) => {
          const labels = Array.from(grid.querySelectorAll('.lyrics'))
            .filter((label) => label.textContent.trim());
          labels.forEach((label) => label.style.removeProperty('left'));
          const items = labels.map((label) => {
            const units = label.classList.contains('positioned-lyrics')
              ? Array.from(label.querySelectorAll('.lyric-unit')) : [label];
            const rects = units.map((unit) => unit.getBoundingClientRect());
            return {
              label, left: Math.min(...rects.map((rect) => rect.left)),
              right: Math.max(...rects.map((rect) => rect.right)), shift: 0,
            };
          }).sort((left, right) => left.left - right.left);
          for (let index = 1; index < items.length; index += 1) {
            const previous = items[index - 1];
            const current = items[index];
            current.shift = Math.max(0, previous.right + 2 - current.left);
            current.left += current.shift;
            current.right += current.shift;
          }
          items.forEach(({label, shift}) => {
            if (shift) label.style.left = `${shift}px`;
          });
        });
      };
      const drawMelodyBeams = (scope = elements.score) => {
        const scale = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--font-scale')) || 1;
        scope.querySelectorAll('.bar-grid').forEach((grid) => {
          grid.querySelectorAll('.melody-beam-line').forEach((line) => line.remove());
          const gridBounds = grid.getBoundingClientRect();
          const timedNotes = Array.from(grid.querySelectorAll('.melody-note[data-duration16ths]'));
          const contentBottom = Math.max(...timedNotes.map((note) => {
            const lowerDots = note.querySelector('.melody-octave.down');
            return (lowerDots || note).getBoundingClientRect().bottom;
          }));
          const drawRun = (run, level) => {
            if (!run.length) return;
            // Keep every duration line in this score row below its lowest octave dot.
            const left = run[0].getBoundingClientRect().left - gridBounds.left;
            const right = run[run.length - 1].getBoundingClientRect().right - gridBounds.left;
            const line = document.createElement('span'); line.className = 'melody-beam-line';
            line.dataset.level = String(level);
            if (run[0].classList.contains('melody-rest')) line.classList.add('rest-beam');
            if (run.some((note) => note.classList.contains('needs-review'))) line.classList.add('needs-review');
            const inset = Math.min(3 * scale, Math.max(0, (right - left - 6) / 2));
            line.style.left = `${left + inset}px`; line.style.width = `${right - left - inset * 2}px`;
            line.style.top = `${contentBottom - gridBounds.top + (level === 2 ? 8 : 4) * scale}px`;
            grid.appendChild(line);
          };
          grid.querySelectorAll('.melody-group').forEach((group) => {
            const notes = Array.from(group.querySelectorAll('.melody-note:not(.melody-rest)[data-duration16ths]'));
            if (!notes.length) return;
            if (group.classList.contains('melody-triplet')) {
              drawRun(notes, 1);
              return;
            }
            [1, 2].forEach((level) => {
              let run = [];
              const flush = () => { drawRun(run, level); run = []; };
              notes.forEach((note) => {
                const start = Number(note.dataset.start16th);
                const duration = Number(note.dataset.duration16ths);
                const eligible = level === 1 ? duration < 4 : duration < 2;
                const previous = run[run.length - 1];
                const adjacent = previous && Number(previous.dataset.start16th) + Number(previous.dataset.duration16ths) === start;
                // The enclosing melody group is one beat; four adjacent sixteenths
                // keep both beam lines continuous across its half-beat midpoint.
                if (!eligible || (previous && !adjacent)) flush();
                if (eligible) run.push(note);
              });
              flush();
            });
          });
          grid.querySelectorAll('.melody-rest[data-duration16ths]').forEach((rest) => {
            const duration = Number(rest.dataset.duration16ths);
            if (duration < 4) drawRun([rest], 1);
            if (duration < 2) drawRun([rest], 2);
          });
        });
      };
      const drawMelodyTies = (scope = elements.score) => {
        const namespace = 'http://www.w3.org/2000/svg';
        scope.querySelectorAll('.bar-grid').forEach((grid) => {
          grid.querySelector('.melody-tie-layer')?.remove();
          const notes = Array.from(grid.querySelectorAll('.melody-note[data-tie-id]'));
          if (!notes.length) return;
          const bounds = grid.getBoundingClientRect();
          const svg = document.createElementNS(namespace, 'svg');
          svg.classList.add('melody-tie-layer');
          svg.setAttribute('viewBox', `0 0 ${bounds.width} ${bounds.height}`);
          const curve = (from, to) => {
            if (to.x <= from.x + 2) return;
            const peak = Math.min(from.y, to.y) - 9;
            const path = document.createElementNS(namespace, 'path');
            path.setAttribute('d', `M ${from.x} ${from.y} C ${from.x + 6} ${peak}, ${to.x - 6} ${peak}, ${to.x} ${to.y}`);
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke', '#aeb5c0');
            path.setAttribute('stroke-width', '1.6');
            path.setAttribute('stroke-linecap', 'round');
            svg.appendChild(path);
          };
          const point = (note, side) => {
            const token = note.querySelector('.melody-number, .melody-pitch') || note;
            const rect = token.getBoundingClientRect();
            const up = note.querySelector('.melody-octave.up')?.getBoundingClientRect();
            return { x: (side === 'right' ? rect.right : rect.left) - bounds.left,
                     y: Math.min(rect.top, up?.top ?? rect.top) - bounds.top - 3 };
          };
          notes.forEach((note) => {
            if (note.dataset.tieOut === 'true') {
              const next = notes.find((candidate) => candidate.dataset.tieId === note.dataset.tieId && candidate.dataset.tieIn === 'true' && Number(candidate.dataset.start16th) > Number(note.dataset.start16th));

              const measure = document.createElement('div');
              measure.className = 'bar-measure';
              measure.style.setProperty('--bar-beats', String(Math.max(1, bar.beats.length)));
              if (bar.meter) {
                measure.dataset.meter = bar.meter_uncertain ? `${bar.meter}?` : bar.meter;
                if (bar.meter_uncertain) measure.title = '拍号待校';
                const meter = document.createElement('span'); meter.className = 'meter-label';
                meter.textContent = measure.dataset.meter;
                meter.setAttribute('aria-label', `拍号 ${measure.dataset.meter}`);
                measure.appendChild(meter);
              }
              bar.beats.forEach((beat) => appendBeat(beat, beatIndex++, measure));
              grid.appendChild(measure);
              rowMeasures.push(measure);
            });
            row.appendChild(grid);
          } else {
            const chords = document.createElement('div'); chords.className = 'line-chords'; renderChordLabels(chords, chordLabels(data), '  ');
            if (Object.values(data.chord_modes || {}).some((labels) => labels.length)
                || data.chords?.length) {
              state.chordTargets.push({node: chords, item: data, separator: '  ', labels: chordLabels(data), keyChange: null});
            }
            row.appendChild(chords);
            if (data.melody_notes?.length) {
              const melody = document.createElement('div'); melody.className = 'melody-cell';
              renderMelodyNotes(melody, data.melody_notes, song.melody_key, song.melody_tonic_midi); row.appendChild(melody);
            }
            const lyrics = document.createElement('div'); lyrics.className = 'line-lyrics'; lyrics.textContent = data.lyrics || '';
            row.appendChild(lyrics);
          }
          fragment.appendChild(row);
          state.measures.push(rowMeasures);
        });
        elements.score.appendChild(fragment);
        scheduleScoreLayout();
      };
      window.dxBandGetPrintSnapshot = () => ({song: state.song, display: state.display, chordMode});
      window.dxBandPdfReady = () => {
        if (!isPdfPage || !state.song?.rows?.length || !state.renderRows.length) return false;
        refreshScoreLayout();
        return true;
      };
      const exportPdf = () => {
        if (!state.song?.rows?.length || pdfExporting) {
          if (!state.song?.rows?.length) toast('当前没有可导出的谱面');
          return;
        }
        if (isLocalDisplay) { location.hash = 'dx-export-pdf'; return; }
        const url = new URL(location.href);
        url.hash = '';
        url.searchParams.set('pdf', '1');
        url.searchParams.set('offline', '1');
        if (!window.open(url.toString(), '_blank')) toast('浏览器阻止了导出页面，请允许弹出窗口');
      };
      const renderGuide = () => {
        const total = Math.max(0, Number(state.guide.total || 0));
        const remaining = Math.min(total, Math.max(0, Number(state.guide.remaining || 0)));
        elements.guide.hidden = !remaining || !total;
        if (!remaining || !total) return;
        elements.guideRemaining.textContent = String(remaining);
        elements.guideDots.innerHTML = '';
        const current = total - remaining;
        const barSize = Math.max(1, Math.floor(total / 2));
        for (let index = 0; index < total; index += 1) {
          const dot = document.createElement('i');
          dot.className = `guide-dot${index < current ? ' elapsed' : ''}${index === current ? ' current' : ''}${index === barSize ? ' new-bar' : ''}`;
          elements.guideDots.appendChild(dot);
        }
      };
      const guideIsActive = () => Number(state.guide.remaining || 0) > 0 && Number(state.guide.total || 0) > 0;
      const setAutoFollow = (enabled) => {
        autoFollow = enabled;
        elements.followPlayback.hidden = enabled || !state.song?.rows?.length;
      };
      const pauseAutoFollow = () => {
        if (!isPdfPage && state.song?.rows?.length) setAutoFollow(false);
      };
      const animate = (now) => {
        requestAnimationFrame(animate);
        if (now - lastAnimationAt < 33) return;
        lastAnimationAt = now;
        const transportPosition = position() + Number(state.display.offset_ms || 0);
        const labels = { playing: '播放中', paused: '已暂停', stopped: '已停止', ended: '已结束', empty: '等待' };
        const transportText = `${formatTime(transportPosition)} · ${labels[state.transport.state] || state.transport.state}`;
        if (transportText !== lastTransportText) {
          elements.transport.textContent = transportText;
          lastTransportText = transportText;
        }
        if (state.song && state.renderRows.length && state.rows.length) {
          const countInActive = guideIsActive();
          const scorePosition = countInActive ? Number(state.renderRows[0].start_ms || 0) : transportPosition;
          let index = 0;
          for (let i = state.renderRows.length - 1; i >= 0; i -= 1) { if (Number(state.renderRows[i].start_ms) <= scorePosition) { index = i; break; } }
          const current = state.renderRows[index]; const nextTop = state.rowTops[index + 1] ?? (state.rowTops[index] + state.rowHeights[index]);
          const measureIndex = current.bars?.findIndex((bar) => scorePosition < Number(bar.end_ms)) ?? -1;
          const nextMeasure = isPdfPage ? null : (state.measures[index]?.[measureIndex < 0 ? current.bars?.length - 1 : measureIndex] || null);
          if (nextMeasure !== activeMeasure) {
            activeMeasure?.classList.remove('active');
            nextMeasure?.classList.add('active');
            activeMeasure = nextMeasure;
          }
          const span = Math.max(1, Number(current.end_ms) - Number(current.start_ms));
          const progress = countInActive ? 0 : clamp((scorePosition - Number(current.start_ms)) / span, 0, 1);
          const scoreY = state.rowTops[index] + (nextTop - state.rowTops[index]) * progress;
          if (autoFollow) {
            const target = state.stageHeight * .34;
            const desiredScroll = Math.max(0, Math.round(scoreY - target));
            if (Math.abs(elements.stage.scrollTop - desiredScroll) >= 1) {
              elements.stage.scrollTop = desiredScroll;
            }
          }
        }
      };
      const setConnected = (connected) => {
        elements.status.classList.toggle('offline', !connected);
        elements.status.querySelector('span').textContent = connected ? '已连接' : '重连中';
      };
      const applySnapshot = (payload) => {
        state.song = payload.song; state.display = payload.display || state.display;
        setAutoFollow(true);
        if (!chordMode) chordMode = state.display.chord_mode;
        chordMode = normalizedChordMode(resolveLegacyMode(chordMode, state.song));
        updateKeyOptions();
        state.guide = payload.guide || state.guide; state.transport = payload.transport || state.transport;
        state.receivedAt = performance.now(); renderSong(); renderGuide();
      };
      if (isOfflinePdfPage) {
        const snapshot = window.opener?.dxBandGetPrintSnapshot?.();
        if (snapshot?.song?.rows?.length) {
          chordMode = normalizedChordMode(snapshot.chordMode);
          applySnapshot(snapshot);
          Promise.all([
            document.fonts.ready,
            ...Array.from(document.images).map((image) => image.decode?.().catch(() => {})),
          ]).then(() => new Promise(requestAnimationFrame)).then(() => {
            refreshScoreLayout();
            window.print();
          });
        }
        window.addEventListener('afterprint', () => window.close());
      } else {
        const source = new EventSource(`/events${isLocalDisplay ? '?local=1' : ''}`);
        source.addEventListener('open', () => setConnected(true));
        source.addEventListener('error', () => setConnected(false));
        source.addEventListener('snapshot', (event) => applySnapshot(JSON.parse(event.data)));
        source.addEventListener('song', (event) => {
          state.song = JSON.parse(event.data);
          setAutoFollow(true);
          updateKeyOptions();
          renderSong();
        });
        source.addEventListener('display', (event) => { state.display = JSON.parse(event.data); });
        source.addEventListener('guide', (event) => { state.guide = JSON.parse(event.data); renderGuide(); });
        source.addEventListener('transport', (event) => { state.transport = JSON.parse(event.data); state.receivedAt = performance.now(); });
      }
      $('smaller').addEventListener('click', () => { fontScale -= .1; applyFontScale(); });
      $('larger').addEventListener('click', () => { fontScale += .1; applyFontScale(); });
      elements.fullscreen.addEventListener('click', toggleFullscreen);
      elements.exportPdf.addEventListener('click', exportPdf);
      elements.followPlayback.addEventListener('click', () => setAutoFollow(true));
      const scrollFromRail = (clientY) => {
        if (!scrollDragMetrics) return;
        const fraction = clamp((clientY - scrollDragMetrics.top - scrollDragOffset) / scrollDragMetrics.travel, 0, 1);
        elements.stage.scrollTop = fraction * scrollDragMetrics.maxScroll;
        scheduleScrollThumbUpdate();
      };
      elements.scrollRail.addEventListener('pointerdown', (event) => {
        if (elements.scrollRail.hidden) return;
        event.preventDefault();
        pauseAutoFollow();
        const thumb = elements.scrollThumb.getBoundingClientRect();
        scrollDragOffset = event.target === elements.scrollThumb ? event.clientY - thumb.top : thumb.height / 2;
        const rail = elements.scrollRail.getBoundingClientRect();
        scrollDragMetrics = {
          top: rail.top,
          travel: Math.max(1, scrollRailMetrics.travel),
          maxScroll: scrollRailMetrics.maxScroll,
        };
        elements.scrollRail.setPointerCapture(event.pointerId);
        scrollFromRail(event.clientY);
      });
      elements.scrollRail.addEventListener('pointermove', (event) => {
        if (scrollDragOffset !== null) scrollFromRail(event.clientY);
      });
      const endScrollDrag = () => { scrollDragOffset = null; scrollDragMetrics = null; };
      elements.scrollRail.addEventListener('pointerup', endScrollDrag);
      elements.scrollRail.addEventListener('pointercancel', endScrollDrag);
      elements.scrollRail.addEventListener('keydown', (event) => {
        const steps = { ArrowUp: -80, ArrowDown: 80, PageUp: -elements.stage.clientHeight, PageDown: elements.stage.clientHeight };
        if (event.key in steps) {
          event.preventDefault(); pauseAutoFollow(); elements.stage.scrollTop += steps[event.key];
        } else if (event.key === 'Home' || event.key === 'End') {
          event.preventDefault(); pauseAutoFollow();
          elements.stage.scrollTop = event.key === 'Home' ? 0 : elements.stage.scrollHeight;
        }
      });
      elements.stage.addEventListener('wheel', pauseAutoFollow, {passive: true});
      elements.stage.addEventListener('touchstart', pauseAutoFollow, {passive: true});
      elements.stage.addEventListener('pointerdown', pauseAutoFollow);
      elements.stage.addEventListener('keydown', (event) => {
        if (['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End', ' '].includes(event.key)) pauseAutoFollow();
      });
      elements.stage.addEventListener('scroll', () => {
        scheduleScrollThumbUpdate();
        scheduleVisibleScoreLayout();
      }, {passive: true});
      document.addEventListener('fullscreenchange', updateFullscreenControl);
      document.querySelectorAll('[data-chord-mode]').forEach((button) => {
        button.addEventListener('click', () => {
          switchChordMode(button.dataset.chordMode);
          toast('和弦模式：级数');
        });
      });
      $('chordKeySelect').addEventListener('change', (event) => {
        switchChordMode(event.target.value);
        toast(`和弦模式：${event.target.selectedOptions[0]?.textContent || chordMode}`);
      });
      $('chordKeySelect').addEventListener('pointerdown', (event) => {
        if (chordMode !== 'degree') return;
        switchChordMode(event.currentTarget.value);
      });
      $('chordKeySelect').addEventListener('keydown', (event) => {
        if (chordMode === 'degree' && ['Enter', ' ', 'ArrowDown'].includes(event.key)) {
          switchChordMode(event.currentTarget.value);
        }
      });
      let lastViewportWidth = window.innerWidth;
      window.addEventListener('resize', () => {
        const widthChanged = window.innerWidth !== lastViewportWidth;
        lastViewportWidth = window.innerWidth;
        if (state.song && (widthChanged || responsiveBarsPerRow() !== state.barsPerRow)) renderSong();
        else requestAnimationFrame(measureRows);
      });
      updateChordModeControl(); updateFullscreenControl(); applyFontScale(); if (!isPdfPage) requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
